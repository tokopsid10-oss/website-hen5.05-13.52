<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
    <title>TOKOPS.ID PS4 PS5 - Cache 5.05 - 13.52</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .name-bryaneiei {
            color: #ffd700 !important;
            font-weight: 900 !important;
            font-size: 3rem !important;
            letter-spacing: 5px !important;
            font-family: 'Orbitron', sans-serif !important;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4) !important;
            display: block !important;
            background: none !important;
            -webkit-background-clip: unset !important;
            -webkit-text-fill-color: #ffd700 !important;
            animation: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-bryaneiei">Bryaneiei</span>
                <span class="ps4-title">PS4</span>
                <span class="ps5-title">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 5.05 - 13.52</div>
        </header>

        <hr class="separator">

        <div class="status-bar">
            <span id="msgs" class="status-text loading">⏳ Starting Cache Installation...</span>
        </div>

        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Bryaneiei</a></p>
            <p class="thanks">❤️ Special thanks to all scene developers</p>
        </footer>
    </div>

    <script>
        window.onload = function () {
            var msgs = document.getElementById('msgs');

            // ====== تنظيف الهيستوري (بعد التحميل) ======
            try {
                history.replaceState(null, null, 'index.html');
                var histlength = history.length;
                if (histlength > 1) {
                    history.go(-histlength);
                }
            } catch (err) {
                console.log("History error:", err);
            }

            // ====== دوال الكاش ======
            function DLProgress(e) {
                var Percent = Math.round(e.loaded / e.total * 100);
                msgs.innerHTML = "Installing Offline Cache: " + Percent + "%";
                msgs.className = "status-text loading";
            }

            function DisplayCacheProgress() {
                msgs.innerHTML = "Cache Installed Successfully ✔";
                msgs.className = "status-text success";
                setTimeout(function () {
                    msgs.innerHTML = "Now Close And Re-Open Your Browser ...";
                }, 1500);
            }

            // ====== التحقق من وجود applicationCache ======
            if (window.applicationCache) {
                window.applicationCache.addEventListener("progress", DLProgress, false);
                window.applicationCache.oncached = function (e) { DisplayCacheProgress(); };
                window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
                window.applicationCache.onerror = function (e) {
                    msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
                    msgs.className = "status-text error";
                };
            } else {
                msgs.innerHTML = "Your browser does not support Offline Cache.";
                msgs.className = "status-text error";
            }
        };
    </script>
</body>
</html>
